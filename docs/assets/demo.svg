<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
  <title id="t">model-secici in a terminal</title>
  <desc id="d">Two prompts routed. A 40-file refactor goes to OpenCode (DeepSeek V4.1 Flash, then MiMo-V2.6-Pro). Finding a production race condition moves the badge to Claude Opus 5.5 at xhigh effort.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
      .dim { fill: #7d8590; } .cmd { fill: #58a6ff; font-weight: 700; } .task { fill: #e6edf3; }
      .claude { fill: #d2a8ff; font-weight: 700; } .oc { fill: #3fb950; font-weight: 700; }
      .ok { fill: #56d364; font-weight: 700; } .eff { fill: #f0f6fc; font-weight: 700; } .ev { fill: #8b949e; }
      .step { opacity: 0; animation: show .01s linear forwards; }
      @keyframes show { to { opacity: 1; } }
      .s1 { animation-delay: .3s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.6s; }
      .s4 { animation-delay: 2.1s; } .s5 { animation-delay: 4.2s; } .s6 { animation-delay: 5s; } .s7 { animation-delay: 5.5s; } .s8 { animation-delay: 6s; }
      @media (prefers-reduced-motion: reduce) { .step { opacity: 1; animation: none; } }
    </style>
  </defs>
  <rect width="1000" height="450" rx="12" fill="#010409"/>
  <rect x=".5" y=".5" width="999" height="449" rx="11.5" fill="none" stroke="#30363d"/>
  <rect width="1000" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="1000" height="12" fill="#161b22"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="44" cy="19" r="6" fill="#ffbd2e"/><circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="500" y="24" text-anchor="middle" class="dim" style="font-size:13px">claude — model-secici</text>

  <!-- prompt 1 -->
  <g class="step s1"><text x="28" y="76"><tspan class="cmd">❯ /model-secici</tspan> <tspan class="task">Refactor the payment module across these 40 files to the new</tspan></text>
  <text x="28" y="98" class="task">  idempotency-key API, update every caller, make the test suite pass.</text></g>
  <g class="step s2"><text x="28" y="136"><tspan class="claude">Claude:   </tspan><tspan class="task">Sonnet 5.5 · effort: </tspan><tspan class="eff">high</tspan></text></g>
  <g class="step s3"><text x="28" y="160"><tspan class="oc">OpenCode: </tspan><tspan class="ok">✅ RECOMMENDED AI</tspan><tspan class="dim"> · </tspan><tspan class="task">#1 DeepSeek V4.1 Flash · </tspan><tspan class="eff">max</tspan><tspan class="dim"> · </tspan><tspan class="task">#2 MiMo-V2.6-Pro · </tspan><tspan class="eff">default</tspan></text></g>
  <g class="step s4"><text x="28" y="190" class="ev">Evidence: D=2 feature work is a tie on the independent DeepSWE (71.7 vs 70.5, ±7)</text>
  <text x="28" y="210" class="ev">          at USD 0.13 vs Opus 5.5's 1.67 per agent task. Claude's lead starts at D=3.</text></g>

  <!-- prompt 2 -->
  <g class="step s5"><text x="28" y="270"><tspan class="cmd">❯ /model-secici</tspan> <tspan class="task">Find the race condition that flakes in prod sometimes</tspan></text></g>
  <g class="step s6"><text x="28" y="308"><tspan class="claude">Claude:   </tspan><tspan class="ok">✅ RECOMMENDED AI</tspan><tspan class="dim"> · </tspan><tspan class="task">Opus 5.5 · effort: </tspan><tspan class="eff">xhigh</tspan></text></g>
  <g class="step s7"><text x="28" y="332"><tspan class="oc">OpenCode: </tspan><tspan class="task">#1 MiMo-V2.6-Pro · </tspan><tspan class="eff">default</tspan><tspan class="dim"> · </tspan><tspan class="task">#2 DeepSeek V4.1 Flash · </tspan><tspan class="eff">max</tspan></text></g>
  <g class="step s8"><text x="28" y="362" class="ev">Evidence: D=3 reasoning half has two agreeing AA rows (HLE 61 vs 49, CritPt 32 vs 27);</text>
  <text x="28" y="382" class="ev">          the terminal half sets no direction, so the direction decides.</text>
  <text x="28" y="412" class="dim">⚡ Claude /fast available (2.5x faster, 2× price).</text></g>

  <text x="28" y="428" class="dim" style="font-size:13px">The badge is computed, not habitual — make the task harder and it moves.</text>
</svg>
