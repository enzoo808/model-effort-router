<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="524" viewBox="0 0 1100 524" role="img" aria-labelledby="t d">
  <title id="t">model-secici in a terminal</title>
  <desc id="d">Two prompts routed. A 40-file refactor goes to OpenCode (DeepSeek V4.1 Flash, then MiMo-V2.6-Pro). Finding a production race condition moves the badge to Claude Opus 5.5 at xhigh effort.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
      .dim { fill: #7d8590; } .cmd { fill: #58a6ff; font-weight: 700; } .task { fill: #e6edf3; }
      .claude { fill: #d2a8ff; font-weight: 700; } .oc { fill: #3fb950; font-weight: 700; }
      .ok { fill: #56d364; font-weight: 700; } .eff { fill: #f0f6fc; font-weight: 700; } .ev { fill: #8b949e; }
      /* Visible by default: a renderer that ignores CSS animations shows the whole terminal.
         Where animations run, each step starts hidden (fill-mode: backwards) and fades in after its delay. */
      .step { animation: show .01s linear backwards; }
      @keyframes show { from { opacity: 0; } }
      .s1 { animation-delay: .3s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.1s; }
      .s5 { animation-delay: 4.2s; } .s6 { animation-delay: 5s; } .s7 { animation-delay: 5.5s; } .s8 { animation-delay: 6s; }
      @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
    </style>
  </defs>
  <rect width="1100" height="524" rx="12" fill="#010409"/>
  <rect x=".5" y=".5" width="1099" height="523" rx="11.5" fill="none" stroke="#30363d"/>
  <rect width="1100" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="1100" height="12" fill="#161b22"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="44" cy="19" r="6" fill="#ffbd2e"/><circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="550" y="24" text-anchor="middle" class="dim" style="font-size:13px">claude — model-secici</text>

  <g class="step s1"><text x="28" y="76"><tspan class="cmd">❯ /model-secici</tspan><tspan class="task"> Refactor the payment module across these 40 files to use the new idempotency-key API,</tspan></text></g>
  <g class="step s1"><text x="28" y="98"><tspan class="task">  update every caller, and make the test suite pass.</tspan></text></g>
  <g class="step s2"><text x="28" y="133"><tspan class="claude">Claude:   </tspan><tspan class="task">Sonnet 5.5 · effort: </tspan><tspan class="eff">high</tspan></text></g>
  <g class="step s3"><text x="28" y="155"><tspan class="oc">OpenCode: </tspan><tspan class="ok">✅ RECOMMENDED AI</tspan><tspan class="dim"> · </tspan><tspan class="task">#1 DeepSeek V4.1 Flash · effort: </tspan><tspan class="eff">max</tspan><tspan class="dim"> · </tspan><tspan class="task">#2 MiMo-V2.6-Pro · effort: </tspan><tspan class="eff">default</tspan></text></g>
  <g class="step s4"><text x="28" y="183"><tspan class="ev">Evidence: Mid-difficulty feature work is a tie on the independent DeepSWE (DeepSeek 71.7 vs</tspan></text></g>
  <g class="step s4"><text x="28" y="205"><tspan class="ev">          Sonnet 5.5 70.5, ±7) at USD 0.13 against Opus 5.5's 1.67 per agent task; Claude's</tspan></text></g>
  <g class="step s4"><text x="28" y="227"><tspan class="ev">          lead starts at D=3.</tspan></text></g>
  <g class="step s4"><text x="28" y="249"><tspan class="dim">DeepSeek V4.1 Flash: peak hours cost 2× (04–07 and 09–13 TR time, Mon–Fri); …</tspan></text></g>
  <g class="step s5"><text x="28" y="297"><tspan class="cmd">❯ /model-secici</tspan><tspan class="task"> Find the race condition that flakes in prod sometimes</tspan></text></g>
  <g class="step s6"><text x="28" y="332"><tspan class="claude">Claude:   </tspan><tspan class="ok">✅ RECOMMENDED AI</tspan><tspan class="dim"> · </tspan><tspan class="task">Opus 5.5 · effort: </tspan><tspan class="eff">xhigh</tspan></text></g>
  <g class="step s7"><text x="28" y="354"><tspan class="oc">OpenCode: </tspan><tspan class="task">#1 MiMo-V2.6-Pro · effort: </tspan><tspan class="eff">default</tspan><tspan class="dim"> · </tspan><tspan class="task">#2 DeepSeek V4.1 Flash · effort: </tspan><tspan class="eff">max</tspan></text></g>
  <g class="step s8"><text x="28" y="382"><tspan class="ev">Evidence: D=3 reasoning half has two agreeing AA rows (HLE 61 vs 49, CritPt 32 vs 27); the</tspan></text></g>
  <g class="step s8"><text x="28" y="404"><tspan class="ev">          terminal half sets no direction, so the direction decides.</tspan></text></g>
  <g class="step s8"><text x="28" y="426"><tspan class="dim">DeepSeek V4.1 Flash: peak hours cost 2× (04–07 and 09–13 TR time, Mon–Fri); …</tspan></text></g>
  <g class="step s8"><text x="28" y="448"><tspan class="dim">⚡ Claude /fast available (2.5x faster, 2× price).</tspan></text></g>

  <text x="28" y="496" class="dim" style="font-size:13px">Abridged example output. The badge is computed, not habitual — make the task harder and it moves.</text>
</svg>
