name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    name: routing policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grader self-test (goldens vs grader)
        run: python evals/routing/grade_routing.py --selftest --results-dir "$RUNNER_TEMP/selftest"
      - name: Policy sync (SKILL.md == routing_policy.json)
        run: python scripts/check_policy_sync.py
      - name: OpenCode pool, rows and badge table
        run: python scripts/check_opencode_pool.py
      - name: Worked examples agree with goldens
        run: python scripts/check_examples.py
      - name: Benchmark records validate
        run: python scripts/validate_benchmarks.py
      - name: Frontier compiler tests
        run: python scripts/test_frontier_compiler.py
